<script>
const CAT={frozen:'1. แช่แข็ง / ซีฟู้ด',produce:'2. ผักสด / ไข่',rice:'3. ข้าว / เส้น / แป้ง / น้ำตาล',sauce:'4. ซอส / กะทิ / เครื่องแกง',seasoning:'5. เครื่องปรุง / สมุนไพร',meat:'1. เนื้อสัตว์ / ไก่',fish:'2. อาหารทะเล / แช่แข็ง',other:'3. อื่น ๆ'};
let DATA={};const PRICEHISTKEY='restaurant_supplier_price_history_v6';let priceHistory=JSON.parse(localStorage.getItem(PRICEHISTKEY)||'[]');const KEY='restaurant_supplier_combined_v1';const HISTKEY='restaurant_supplier_order_history_v3';const MASTERKEY='restaurant_supplier_master_v4';let state=JSON.parse(localStorage.getItem(KEY)||'{}');let history=JSON.parse(localStorage.getItem(HISTKEY)||'[]');let editing=null;
function save(){localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem(HISTKEY,JSON.stringify(history));localStorage.setItem(PRICEHISTKEY,JSON.stringify(priceHistory))}function key(s,id){return s+'_'+id}function setWant(s,id,v){let k=key(s,id);state[k]=state[k]||{want:0,total:0};state[k].want=Math.max(0,+v||0);save();renderTotals()}
function snapshotWeek(){let now=new Date(), items=[], suppliers={thch:{qty:0,spend:0},booker:{qty:0,spend:0},sains:{qty:0,spend:0}};for(const sup in DATA)for(const i of DATA[sup]){let st=state[key(sup,i.id)]||{},q=+st.total||0;if(q>0){let amount=q*(i.price||0);items.push({supplier:sup,id:i.id,name:i.name,qty:q,unit:i.unit,price:i.price||0,amount});suppliers[sup].qty+=q;suppliers[sup].spend+=amount}}if(!items.length)return false;history.push({closedAt:now.toISOString(),items,suppliers});return true}
function resetWeek(){if(confirm('ปิดสัปดาห์นี้ บันทึกจำนวนและค่าใช้จ่ายลงประวัติรายเดือน แล้วเริ่มสัปดาห์ใหม่หรือไม่?')){for(const sup in DATA)for(const i of DATA[sup]){let st=state[key(sup,i.id)]||{want:0,total:0};st.total+=(+st.want||0);st.want=0;state[key(sup,i.id)]=st}snapshotWeek();for(const sup in DATA)for(const i of DATA[sup])state[key(sup,i.id)]={want:0,total:0};save();render()}}
function currentLive(){let suppliers={thch:{qty:0,spend:0},booker:{qty:0,spend:0},sains:{qty:0,spend:0}};for(const sup in DATA)for(const i of DATA[sup]){let st=state[key(sup,i.id)]||{},q=(+st.total||0)+(+st.want||0);suppliers[sup].qty+=q;suppliers[sup].spend+=q*(i.price||0)}return suppliers}
function money(n){return '£'+(+n||0).toFixed(2)}function monthRange(d){return {start:new Date(d.getFullYear(),d.getMonth(),1),end:new Date(d.getFullYear(),d.getMonth()+1,0,23,59,59,999)}}
function buildReport(){let now=new Date(),rg=monthRange(now),weeks=history.filter(h=>{let d=new Date(h.closedAt);return d>=rg.start&&d<=rg.end});let live=currentLive();if(Object.values(live).some(x=>x.qty>0))weeks.push({closedAt:now.toISOString(),suppliers:live,live:true});let names={thch:'TH/CH SUP',booker:'BOOKER SUP',sains:'SUPERMARKET'},tot={thch:{qty:0,spend:0},booker:{qty:0,spend:0},sains:{qty:0,spend:0}};weeks.forEach(w=>Object.keys(tot).forEach(k=>{let x=w.suppliers[k]||{};tot[k].qty+=x.qty||0;tot[k].spend+=x.spend||0}));let tq=Object.values(tot).reduce((a,x)=>a+x.qty,0),ts=Object.values(tot).reduce((a,x)=>a+x.spend,0);let fmt=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});let rows=weeks.map((w,idx)=>{let q=0,c=0;Object.values(w.suppliers).forEach(x=>{q+=x.qty||0;c+=x.spend||0});return `<tr><td>Week ${idx+1}${w.live?' (current)':''}<br><small>${fmt(new Date(w.closedAt))}</small></td><td>${w.suppliers.thch?.qty||0}<br>${money(w.suppliers.thch?.spend)}</td><td>${w.suppliers.booker?.qty||0}<br>${money(w.suppliers.booker?.spend)}</td><td>${w.suppliers.sains?.qty||0}<br>${money(w.suppliers.sains?.spend)}</td><td><b>${q}</b><br><b>${money(c)}</b></td></tr>`}).join('')||'<tr><td colspan="5">ยังไม่มีประวัติการสั่งซื้อในเดือนนี้</td></tr>';document.getElementById('report').innerHTML=`<div class="report"><h1>สรุปการสั่งซื้อวัตถุดิบประจำเดือน</h1><div class="period">${fmt(rg.start)} – ${fmt(rg.end)}</div><div class="cards"><div class="card">จำนวนที่สั่งรวม<b>${tq}</b></div><div class="card">ค่าใช้จ่ายรวม<b>${money(ts)}</b></div><div class="card">จำนวนสัปดาห์<b>${weeks.length}</b></div></div><h2>รวมทั้งเดือน แยก Supplier</h2><table class="rtable"><tr><th>Supplier</th><th>จำนวน</th><th>ค่าใช้จ่าย</th></tr>${Object.keys(tot).map(k=>`<tr><td>${names[k]}</td><td>${tot[k].qty}</td><td>${money(tot[k].spend)}</td></tr>`).join('')}<tr class="grand"><td>รวมเดือน</td><td>${tq}</td><td>${money(ts)}</td></tr></table><h2>สรุปแต่ละสัปดาห์</h2><table class="rtable"><tr><th>สัปดาห์</th><th>TH/CH<br>จำนวน / £</th><th>BOOKER<br>จำนวน / £</th><th>SUPERMARKET<br>จำนวน / £</th><th>รวม<br>จำนวน / £</th></tr>${rows}</table><div class="note">รอบเดือนเริ่มวันที่ 1 ถึงวันสุดท้ายของเดือน • ยอดย้อนหลังใช้ราคา ณ เวลาที่ปิดสัปดาห์ • สัปดาห์ปัจจุบันรวมข้อมูลที่ยังไม่ปิดสัปดาห์</div></div>`}

function openReceiptOCR(){ocrModal.classList.add('show');ocrResults.innerHTML='';ocrStatus.textContent='ถ่ายรูปหรือเลือกภาพใบเสร็จ แล้วกด “อ่านใบเสร็จ”';ocrProgress.style.width='0%'}

function closeReceiptOCR(){ocrModal.classList.remove('show')}
let selectedReceiptFile=null;function selectReceiptFile(f){if(!f)return;selectedReceiptFile=f;receiptPreview.src=URL.createObjectURL(f);receiptPreview.style.display='block';receiptFileName.textContent=f.name||'receipt image';ocrResults.innerHTML='';ocrStatus.textContent='เลือกรูปแล้ว กด “อ่านใบเสร็จ”'}receiptCamera?.addEventListener('change',e=>selectReceiptFile(e.target.files?.[0]));receiptLibrary?.addEventListener('change',e=>selectReceiptFile(e.target.files?.[0]));
function cleanReceiptLine(x){return (x||'').replace(/[£$€]/g,' £').replace(/[|]/g,' ').replace(/\s+/g,' ').trim()}
function receiptAliasName(name){
  return (name||'')
    .replace(/\bLTTL\b/gi,'LITTLE')
    .replace(/\bLTTCE\b/gi,'LETTUCE')
    .replace(/\bLETTUC\b/gi,'LETTUCE')
    .replace(/\bSWT\b/gi,'SWEET')
    .replace(/\bGEM\s+LETT(?:UC|CE)\b/gi,'GEM LETTUCE')
    .replace(/\bJS\b/gi,'')
    .replace(/\bASDA\b/gi,'')
    .replace(/\s{2,}/g,' ').trim();
}
function parseHooHingReceipt(text){
  const lines=text.split(/\n+/).map(cleanReceiptLine).filter(x=>x.length>1),out=[];
  const stop=/^(?:\*{2,}|goods total|carriage|v\.?a\.?t|grand total|amount tendered|home delivery|you would|please keep|total savings|tax summary)/i;
  const header=/^(?:mitcham branch|bond rd|www\.|awrs|telephone|vat registration|sale by|invoice|date|product description|quantity|price per|total\b)/i;
  const stripMarks=x=>x.replace(/^(?:[#>*+@]{1,6}\s*)+/,'').replace(/\s{2,}/g,' ').trim();
  let cur=null,pendingDesc='';
  const pushCur=()=>{if(cur&&cur.name&&cur.price>0){cur.name=receiptAliasName(cur.name);out.push(cur)}cur=null};
  for(let raw of lines){
    let line=raw.replace(/,/g,'.').trim();
    if(stop.test(line)){pushCur();break}
    if(header.test(line))continue;
    let sm=line.match(/stock\s*code\s*[=:]?\s*([0-9OIl]{3,8})/i);
    if(sm){pushCur();let code=sm[1].replace(/[O]/g,'0').replace(/[Il]/g,'1');cur={raw:'',stockCode:code,name:'',qty:1,price:0,total:0,pack:''};continue}
    let q=line.match(/^\s*(\d+(?:\.\d+)?)\s*[xX×%]\s*(?:£\s*)?(\d+(?:\.\d{1,2}))(?:\s+(.*?))?(?:\s+(\d+(?:\.\d{2})))?\s*$/);
    if(q&&!cur&&pendingDesc){cur={raw:'',stockCode:'',name:pendingDesc,qty:1,price:0,total:0,pack:''}}
    if(!cur){let pd=stripMarks(line);if(pd&&/[A-Za-z]{3}/.test(pd)&&!/^(?:stock|code|invoice|registration|number|points|cash|card|change)/i.test(pd))pendingDesc=pd;continue}
    if(q){let qty=parseFloat(q[1]),price=parseFloat(q[2]);if(qty>0)cur.qty=qty;if(price>0)cur.price=price;let tail=(q[3]||'').trim();let tm=tail.match(/^(.*?)(?:\s+)(\d+(?:\.\d{2}))$/);if(tm){tail=tm[1].trim();cur.total=parseFloat(tm[2])||0}else if(q[4])cur.total=parseFloat(q[4])||0;cur.pack=tail;cur.raw=(cur.name+' | '+raw).trim();pushCur();pendingDesc='';continue}
    let desc=stripMarks(line);if(desc&&/[A-Za-z]{2}/.test(desc)&&!/^(?:stock|code|invoice|registration|number|points|cash|card|change)/i.test(desc)){cur.name=cur.name?cur.name+' '+desc:desc;pendingDesc=cur.name}
  }
  pushCur();return out.filter(r=>r.name&&r.price>0);
}
function parseSupermarketReceipt(text){
  const lines=text.split(/\n+/).map(cleanReceiptLine).map(x=>x.replace(/,/g,'.').trim()).filter(Boolean), rows=[];
  const ignore=/^(?:@|sainsbury|asda|charterhouse|wandsworth|www\b|vat\b|balance|mastercard|contactless|merchant|auth|aid|pan|tid|change|points|total\b|total savings|tax summary|no items|card\b|date\b|time\b|sale\b|please|for a chance|good food)/i;
  for(let line of lines){
    if(ignore.test(line))continue;
    let m=line.match(/^(.*?)[\s:]+£?\s*(\d+\.\d{2})\s*$/i);
    if(!m) m=line.match(/^(.*?)[\s:]+(\d+\.\d{2})\s*$/i);
    if(!m)continue;
    let name=receiptAliasName(m[1].replace(/^[^A-Za-z]+/,'').replace(/\s{2,}/g,' ').trim());
    let price=parseFloat(m[2]);
    if(!name||name.length<3||!/[A-Za-z]/.test(name)||!(price>0))continue;
    if(/^(?:balance|mastercard|card|subtotal|delivery|saving|cash)/i.test(name))continue;
    rows.push({stockCode:'',name,qty:1,price,total:price,pack:'',raw:line});
  }
  // Aggregate exact normalized repeats at the same unit price; preserves differently priced/worded variants.
  const map=new Map();
  for(const r of rows){let k=normName(r.name)+'|'+r.price.toFixed(2);if(map.has(k))map.get(k).qty+=1;else map.set(k,{...r})}
  return [...map.values()];
}
function parseBookerReceipt(text){
  const lines=text.split(/\n+/).map(cleanReceiptLine).map(x=>x.replace(/,/g,'.').trim()).filter(Boolean),out=[];
  const ignore=/^(?:booker|branch|customer|invoice|date|till|operator|code\s+description|payment|amount|total|goods|vat|grand|please)/i;
  for(let line of lines){
    if(ignore.test(line))continue;
    // Typical OCR row: 147179 CE Chicken Breast Fillet 2 5kg 4 55.99 223.96 A
    let m=line.match(/^([0-9]{5,7})\s+(?:[A-Z]{1,4}\s+)?(.+?)\s+(\d+(?:\.\d+)?)\s+(£?\d+\.\d{2})\s+(?:£?\d+\.\d{2})(?:\s+[A-Z])?$/i);
    if(m){let code=m[1],name=receiptAliasName(m[2].trim()),qty=parseFloat(m[3]),price=parseFloat(m[4].replace('£',''));if(name&&qty>0&&price>0)out.push({stockCode:code,name,qty,price,total:qty*price,pack:'',raw:line});continue}
    // Fallback for simple item line ending in a price.
    let f=line.match(/^(.*?[A-Za-z].*?)\s+£?(\d+\.\d{2})\s*$/);if(f){let name=receiptAliasName(f[1].replace(/^\d{5,7}\s+/,'').trim()),price=parseFloat(f[2]);if(name.length>3&&price>0)out.push({stockCode:'',name,qty:1,price,total:price,pack:'',raw:line})}
  }
  return out;
}
function parseReceiptText(text,supplier){
  supplier=supplier||ocrSupplier?.value||'thch';
  if(supplier==='thch')return parseHooHingReceipt(text);
  if(supplier==='booker')return parseBookerReceipt(text);
  if(supplier==='sains')return parseSupermarketReceipt(text);
  return parseHooHingReceipt(text);
}
function similarityItem(name,item){let A=tokens(name),B=tokens(item.name+' '+(item.hint||''));if(!A.size||!B.size)return 0;let inter=[...A].filter(x=>B.has(x)).length;return inter/Math.max(1,Math.min(A.size,B.size))}
function bestMatch(s,name){let best=null,score=0;for(const i of DATA[s]||[]){let z=similarityItem(name,i);if(z>score){score=z;best=i}}return score>=0.45?{item:best,score}:null}
function loadReceiptImage(file){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=URL.createObjectURL(file)})}
async function preprocessReceipt(file){
  const img=await loadReceiptImage(file), sw=img.naturalWidth||img.width, sh=img.naturalHeight||img.height;
  const probe=document.createElement('canvas'), maxProbe=1100, ps=Math.min(1,maxProbe/Math.max(sw,sh));
  probe.width=Math.max(1,Math.round(sw*ps));probe.height=Math.max(1,Math.round(sh*ps));
  const pc=probe.getContext('2d',{willReadFrequently:true});pc.drawImage(img,0,0,probe.width,probe.height);
  const d=pc.getImageData(0,0,probe.width,probe.height).data,w=probe.width,h=probe.height;
  // Receipt paper is generally bright and near-neutral; wood/background is more saturated.
  const col=new Uint32Array(w),row=new Uint32Array(h);
  for(let y=0;y<h;y+=2)for(let x=0;x<w;x+=2){let k=(y*w+x)*4,r=d[k],g=d[k+1],b=d[k+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b),lum=(r+g+b)/3;if(lum>105 && (mx-mn)<72){col[x]+=2;row[y]+=2}}
  let xs=[],ys=[];for(let x=0;x<w;x++)if(col[x]>h*.18)xs.push(x);for(let y=0;y<h;y++)if(row[y]>w*.10)ys.push(y);
  let x0=xs.length?Math.max(0,Math.min(...xs)-12):0,x1=xs.length?Math.min(w-1,Math.max(...xs)+12):w-1;
  let y0=ys.length?Math.max(0,Math.min(...ys)-12):0,y1=ys.length?Math.min(h-1,Math.max(...ys)+12):h-1;
  // Avoid absurd crops; fall back to central 70% width for long receipt photos.
  if((x1-x0)<w*.18 || (x1-x0)>w*.92){x0=Math.round(w*.15);x1=Math.round(w*.85)}
  if((y1-y0)<h*.30){y0=0;y1=h-1}
  const sx=x0/ps,sy=y0/ps,cw=(x1-x0+1)/ps,ch=(y1-y0+1)/ps;
  const targetW=Math.min(1900,Math.max(1350,Math.round(cw*2.8))),scale=targetW/cw,targetH=Math.round(ch*scale);
  const out=document.createElement('canvas');out.width=targetW;out.height=targetH;
  const oc=out.getContext('2d',{willReadFrequently:true});oc.imageSmoothingEnabled=true;oc.imageSmoothingQuality='high';oc.drawImage(img,sx,sy,cw,ch,0,0,targetW,targetH);
  const im=oc.getImageData(0,0,targetW,targetH),a=im.data;
  // Grayscale + contrast + gentle whitening. Keeps thin thermal-printer strokes while suppressing wood texture.
  for(let i=0;i<a.length;i+=4){let gray=.299*a[i]+.587*a[i+1]+.114*a[i+2];gray=(gray-128)*1.55+145;if(gray>205)gray=Math.min(255,gray+20);gray=Math.max(0,Math.min(255,gray));a[i]=a[i+1]=a[i+2]=gray}
  oc.putImageData(im,0,0);
  return out;
}
async function ocrOne(image,psm,baseProgress=0,span=.85){
  return await Tesseract.recognize(image,'eng',{tessedit_pageseg_mode:String(psm),preserve_interword_spaces:'1',logger:m=>{if(m.progress!=null){let p=baseProgress+m.progress*span;ocrProgress.style.width=Math.round(p*100)+'%';ocrStatus.textContent='กำลังอ่านตัวอักษร '+Math.round(p*100)+'%'}}});
}
async function runReceiptOCR(){
  let f=selectedReceiptFile;if(!f)return alert('กรุณาถ่ายหรือเลือกภาพใบเสร็จก่อน');if(!window.Tesseract)return alert('OCR library โหลดไม่สำเร็จ กรุณาตรวจอินเทอร์เน็ตแล้วลองใหม่');
  ocrResults.innerHTML='';ocrStatus.textContent='กำลังตัดขอบและปรับภาพใบเสร็จ…';ocrProgress.style.width='3%';
  try{
    const processed=await preprocessReceipt(f);ocrProgress.style.width='10%';ocrStatus.textContent='ปรับภาพสำเร็จ กำลังอ่านข้อความ…';
    receiptPreview.src=processed.toDataURL('image/jpeg',.92);receiptPreview.style.display='block';
    let r=await ocrOne(processed,6,.10,.78),parsed=parseReceiptText(r.data.text,ocrSupplier.value),raw=r.data.text;
    // If block OCR still finds very few products, retry with sparse-column layout and choose the better parse.
    if(parsed.length<3){ocrStatus.textContent='กำลังลองอ่านแบบที่ 2 เพื่อเพิ่มความแม่นยำ…';let r2=await ocrOne(processed,4,.88,.12),p2=parseReceiptText(r2.data.text,ocrSupplier.value);if(p2.length>parsed.length){parsed=p2;raw=r2.data.text}}
    ocrProgress.style.width='100%';showOCRReview(parsed,raw)
  }catch(e){ocrStatus.textContent='อ่านไม่สำเร็จ: '+e.message}
}
function showOCRReview(rows,raw){let s=ocrSupplier.value;if(!rows.length){ocrResults.innerHTML='<p><b>ยังจับรายการสินค้า/ราคาไม่ได้</b> แต่ OCR อาจอ่านข้อความได้ กรุณาเปิด “ดูข้อความที่อ่านได้” ด้านล่าง</p><details open><summary>ดูข้อความที่อ่านได้</summary><pre style="white-space:pre-wrap">'+raw.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</pre></details>';return}ocrStatus.textContent='พบ '+rows.length+' รายการ กรุณาตรวจสอบก่อนบันทึก';window.__ocrRows=rows;let body=rows.map((r,idx)=>{let bm=bestMatch(s,r.name),opts='<option value="">เพิ่มเป็นสินค้าใหม่</option>'+DATA[s].map(i=>`<option value="${i.id}" ${bm?.item?.id===i.id?'selected':''}>${i.name}</option>`).join('');return `<tr><td><input value="${(r.stockCode||'').replace(/"/g,'&quot;')}" data-rcode="${idx}" style="width:85px"></td><td><input value="${r.name.replace(/"/g,'&quot;')}" data-rname="${idx}"><div class="muted">${r.pack||''}</div></td><td><input type="number" min="0.01" step="0.01" value="${r.qty}" data-rqty="${idx}"></td><td><input type="number" step="0.01" min="0" value="${r.price.toFixed(2)}" data-rprice="${idx}"></td><td><select data-rmatch="${idx}">${opts}</select>${bm?`<div class="muted">จับคู่ ${(bm.score*100).toFixed(0)}%</div>`:''}</td><td><input type="checkbox" data-ruse="${idx}" checked></td></tr>`}).join('');ocrResults.innerHTML=`<table class="ocrtable"><tr><th>Stock</th><th>ชื่อสินค้า / Pack</th><th>จำนวน</th><th>ราคา/หน่วย £</th><th>จับคู่กับสินค้า</th><th>ใช้</th></tr>${body}</table><div class="ocrActions"><button class="btn" onclick="confirmOCR(${rows.length})">✓ ยืนยันและอัปเดต</button></div><details><summary>ดูข้อความ OCR ต้นฉบับ</summary><pre style="white-space:pre-wrap">${raw.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</pre></details><p class="muted">V6.7 หลังยืนยัน OCR จะอัปเดตราคา และนำ Qty จากใบเสร็จไปบวกใน “ผลรวมสั่ง 1 สัปดาห์” ของสินค้านั้นอัตโนมัติ</p>`}
function confirmOCR(n){let s=ocrSupplier.value,changed=0,added=0,qtyAdded=0;for(let idx=0;idx<n;idx++){let use=document.querySelector(`[data-ruse="${idx}"]`);if(!use?.checked)continue;let row=(window.__ocrRows||[])[idx]||{},code=document.querySelector(`[data-rcode="${idx}"]`)?.value.trim()||row.stockCode||'',name=document.querySelector(`[data-rname="${idx}"]`).value.trim(),qty=+document.querySelector(`[data-rqty="${idx}"]`).value||1,price=+document.querySelector(`[data-rprice="${idx}"]`).value||0,id=+document.querySelector(`[data-rmatch="${idx}"]`).value||0;if(!name||price<=0||qty<=0)continue;let receiptHint=[code?`Stock ${code}`:'',row.pack||'',`OCR receipt ${new Date().toLocaleDateString('en-GB')}`].filter(Boolean).join(' · ');let targetId=0;if(id){let i=DATA[s].find(x=>x.id===id);if(i){priceHistory.push({at:new Date().toISOString(),supplier:s,id:i.id,name:i.name,oldPrice:i.price||0,newPrice:price,source:'receipt-ocr',stockCode:code,qty});i.price=price;if(code&&!String(i.hint||'').includes(code))i.hint=(i.hint?i.hint+' · ':'')+receiptHint;else if(!i.hint)i.hint=receiptHint;targetId=i.id;changed++;}}else{let nid=Math.max(0,...DATA[s].map(x=>+x.id||0))+1;DATA[s].push({id:nid,name,cat:DATA[s][0]?.cat||'other',unit:'item',price,weekly:0,hint:receiptHint});targetId=nid;added++;}if(targetId){let k=key(s,targetId);state[k]=state[k]||{want:0,total:0};state[k].total=(+state[k].total||0)+qty;qtyAdded+=qty;}}localStorage.setItem(PRICEHISTKEY,JSON.stringify(priceHistory));persistMaster();save();render();ocrStatus.innerHTML=`<span class="ok">บันทึกแล้ว: อัปเดตราคา ${changed} รายการ · เพิ่มใหม่ ${added} รายการ · เพิ่มยอดสั่งสัปดาห์นี้ ${qtyAdded} หน่วย</span>`;ocrResults.innerHTML=''}

function persistMaster(){localStorage.setItem(MASTERKEY,JSON.stringify(DATA))}
const RECEIPT_MIGRATION_KEY='restaurant_supplier_receipt_update_20260828_v1';
function applyReceiptUpdate20260828(){
  if(localStorage.getItem(RECEIPT_MIGRATION_KEY))return;
  DATA.sains=DATA.sains||[];
  const upserts=[
    {id:9,name:'Extra Lean Pork Mince 5% Fat',hint:'500g · Sainsbury’s receipt 28/08/26',cat:'meat',unit:'500g pack',price:2.49,weekly:8,size:0.5,sizeUnit:'kg'},
    {id:16,name:'Fine Beans',hint:'120g · Sainsbury’s receipt 28/08/26',cat:'produce',unit:'120g pack',price:1.10,weekly:4,size:120,sizeUnit:'g'},
    {id:17,name:'Spring Green',hint:'ASDA receipt 28/08/26',cat:'produce',unit:'each',price:0.84,weekly:4,size:1,sizeUnit:'piece'},
    {id:18,name:'Nuts',hint:'ASDA receipt 28/08/26 · receipt label “NUTS”; promotion applied at till',cat:'other',unit:'pack',price:2.28,weekly:5}
  ];
  for(const u of upserts){
    const ix=DATA.sains.findIndex(x=>x.id===u.id);
    if(ix<0) DATA.sains.push(u); else DATA.sains[ix]={...DATA.sains[ix],...u};
  }
  localStorage.setItem(RECEIPT_MIGRATION_KEY,'1');
  persistMaster();
}

function normName(n){return (n||'').toLowerCase().replace(/coca[- ]?cola/g,'coke').replace(/zero sugar/g,'zero').replace(/\b\d+(?:\.\d+)?\s*(kg|g|ml|l|pcs?|pieces?|x)\b/g,' ').replace(/\b(sainsbury'?s|gold plum|happy boy|green dragon|first lady|chaokoh|mae ploy|booker)\b/g,' ').replace(/[^a-zก-๙]+/g,' ').trim()}
function tokens(n){return new Set(normName(n).split(/\s+/).filter(x=>x.length>2))}
function baseUnit(i){let size=+i.size||0,u=(i.sizeUnit||'').toLowerCase();if(!size){let t=(i.name+' '+(i.hint||'')).toLowerCase(),mx=t.match(/(\d+)\s*[x×]\s*(\d+(?:\.\d+)?)\s*(kg|g|ml|l)\b/),m=t.match(/(\d+(?:\.\d+)?)\s*(kg|g|ml|l)\b/);if(mx){size=(+mx[1])*(+mx[2]);u=mx[3]}else if(m){size=+m[1];u=m[2]}}if(!size||!i.price)return null;if(u==='g')return {kind:'kg',v:i.price/(size/1000)};if(u==='kg')return {kind:'kg',v:i.price/size};if(u==='ml')return {kind:'l',v:i.price/(size/1000)};if(u==='l')return {kind:'l',v:i.price/size};if(u==='piece')return {kind:'piece',v:i.price/size};return null}
function sameProduct(a,b){let A=tokens(a.name),B=tokens(b.name);if(!A.size||!B.size)return false;let inter=[...A].filter(x=>B.has(x)).length,den=Math.min(A.size,B.size);return den&&inter/den>=0.67}
function expensiveSet(){let all=[];Object.entries(DATA).forEach(([s,arr])=>arr.forEach(i=>all.push({s,i,b:baseUnit(i)})));let bad=new Set();for(let x=0;x<all.length;x++)for(let y=x+1;y<all.length;y++){let a=all[x],b=all[y];if(a.s===b.s||!a.b||!b.b||a.b.kind!==b.b.kind||!sameProduct(a.i,b.i))continue;if(a.b.v>b.b.v*1.001)bad.add(key(a.s,a.i.id));else if(b.b.v>a.b.v*1.001)bad.add(key(b.s,b.i.id))}return bad}
function catOptions(s){let cats=[...new Set(DATA[s].map(i=>i.cat))];return cats.map(c=>`<option value="${c}">${CAT[c]||c}</option>`).join('')}
function openItem(s,id=null){editing={s,id};let i=id==null?{name:'',cat:DATA[s][0]?.cat||'other',unit:'pack',price:'',hint:'',size:'',sizeUnit:''}:DATA[s].find(x=>x.id===id);document.getElementById('modalTitle').textContent=id==null?'เพิ่มสินค้า':'แก้ไขสินค้า';fCat.innerHTML=catOptions(s);fName.value=i.name||'';fCat.value=i.cat;fUnit.value=i.unit||'';fPrice.value=i.price??'';fHint.value=i.hint||'';fSize.value=i.size||'';fSizeUnit.value=i.sizeUnit||'';editModal.classList.add('show')}
function closeModal(){editModal.classList.remove('show');editing=null}
function saveItem(){if(!editing||!fName.value.trim())return alert('กรุณาใส่ชื่อสินค้า');let {s,id}=editing,obj={name:fName.value.trim(),cat:fCat.value,unit:fUnit.value.trim()||'pack',price:fPrice.value===''?null:+fPrice.value,hint:fHint.value.trim(),size:fSize.value===''?null:+fSize.value,sizeUnit:fSizeUnit.value,weekly:0};if(id==null){obj.id=Math.max(0,...DATA[s].map(x=>+x.id||0))+1;DATA[s].push(obj)}else{let ix=DATA[s].findIndex(x=>x.id===id);obj.id=id;obj.weekly=DATA[s][ix].weekly||0;DATA[s][ix]={...DATA[s][ix],...obj}}persistMaster();closeModal();render()}
function deleteItem(s,id){let i=DATA[s].find(x=>x.id===id);if(!i||!confirm(`ลบ “${i.name}” ออกจากรายการถาวรหรือไม่?`))return;DATA[s]=DATA[s].filter(x=>x.id!==id);delete state[key(s,id)];persistMaster();save();render()}
function supplierPDF(s){document.body.dataset.printSupplier=s;window.print();setTimeout(()=>delete document.body.dataset.printSupplier,500)}
function combinedPDF(){buildReport();document.body.dataset.printCombined='1';window.print();setTimeout(()=>delete document.body.dataset.printCombined,500)}
function renderTotals(){document.querySelectorAll('[data-total]').forEach(e=>{let s=e.dataset.total,total=0;for(const i of DATA[s]){let st=state[key(s,i.id)]||{};total+=(st.want||0)*(i.price||0)}e.textContent='£'+total.toFixed(2)})}
function panel(s,title,cls){let groups={};DATA[s].forEach(i=>(groups[i.cat]??=[]).push(i));let costly=expensiveSet();let html=`<section class="supplier ${cls}"><div class="head"><span>${title}</span><button class="pdfbtn" onclick="supplierPDF('${s}')">PDF</button></div><div class="addbar"><button class="addbtn" onclick="openItem('${s}')">＋ เพิ่มสินค้า</button><button class="addbtn" onclick="openReceiptOCRFor('${s}')">📷 ใบเสร็จ</button></div><div class="sub"><span>รายการ / ราคา</span><span class="want">จำนวนที่<br>ต้องการ</span><span class="week">ผลรวมสั่ง<br>1 สัปดาห์</span></div>`;for(const [cat,items] of Object.entries(groups)){html+=`<div class="cat">${CAT[cat]||cat}</div>`;for(const i of items){let k=key(s,i.id),st=state[k]||{want:0,total:i.weekly||0};if(!state[k])state[k]=st;let warn=costly.has(k)?'<span class="warn" title="พบสินค้าประเภทเดียวกันที่ราคาต่อหน่วยถูกกว่าใน Supplier อื่น">!</span>':'';html+=`<div class="row"><div><div class="name">${i.id}. ${i.name}${warn}</div><div class="hint">${i.hint||''}</div><div class="price">£${(i.price||0).toFixed(2)} · ${i.unit}</div><div class="manage"><button class="mini" onclick="openItem('${s}',${i.id})">แก้ไข</button><button class="mini danger" onclick="deleteItem('${s}',${i.id})">ลบ</button></div></div><div><input class="qty" type="number" min="0" value="${st.want||''}" oninput="setWant('${s}',${i.id},this.value)"><div class="unit">${i.unit}</div></div><div><input class="weekly" readonly value="${st.total||0}"><div class="unit">${i.unit}</div></div></div>`}}html+=`<div class="sum"><span>มูลค่าที่ต้องการวันนี้</span><span data-total="${s}">£0.00</span></div></section>`;return html}
fetch('data.json').then(r=>r.json()).then(d=>{let saved=localStorage.getItem(MASTERKEY);DATA=saved?JSON.parse(saved):d;if(!saved)persistMaster();applyReceiptUpdate20260828();render()});function render(){document.getElementById('app').innerHTML=panel('thch','🏪 TH/CH SUP','th')+panel('booker','BOOKER SUP','bk')+panel('sains','🛒 SUPERMARKET','sa');save();renderTotals()}
