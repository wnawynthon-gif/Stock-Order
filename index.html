<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant Supplier Order</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f5f1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#27231f}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #ddd;padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between}.top h1{font-size:20px;margin:0}.actions{display:flex;gap:8px}.btn{border:1px solid #ddd;background:#fff;border-radius:10px;padding:10px 12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,minmax(300px,1fr));gap:14px;padding:14px;align-items:start}.supplier{background:#fff;border:1px solid #ddd;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px #0000000d}.head{padding:14px;color:#fff;font-size:20px;font-weight:800;display:flex;justify-content:space-between;align-items:center}.pdfbtn{border:0;background:#ffffffee;color:inherit;border-radius:8px;padding:7px 10px;font-weight:800}.th .head{background:#71349a}.bk .head{background:#ee650e}.sa .head{background:#239c3b}.sub{padding:10px 12px;border-bottom:1px solid #eee;display:grid;grid-template-columns:1fr 78px 78px;gap:7px;font-size:12px;font-weight:700}.sub .want{color:#268b35}.sub .week{color:#1464c5}.cat{padding:8px 12px;font-weight:800}.th .cat{background:#f3eafb;color:#71349a}.bk .cat{background:#fff0e4;color:#dc5807}.sa .cat{background:#eaf8ed;color:#188331}.row{padding:10px 12px;border-bottom:1px solid #eee;display:grid;grid-template-columns:1fr 68px 68px;gap:8px;align-items:center}.name{font-size:13px;font-weight:650}.hint{font-size:10px;color:#777;margin-top:3px}.price{font-size:12px;margin-top:5px}.qty,.weekly{width:100%;height:40px;border-radius:8px;text-align:center;font-size:17px;font-weight:750}.qty{border:1.5px solid #91d39b;color:#227f31}.weekly{border:1.5px solid #8bbcf1;background:#f5faff;color:#1261b9}.unit{font-size:9px;text-align:center;color:#666}.sum{padding:12px;font-weight:800;display:flex;justify-content:space-between}.th .sum{color:#71349a}.bk .sum{color:#dc5807}.sa .sum{color:#188331}#report{display:none}.report{font-size:11px}.report h1{font-size:20px;margin:0 0 4px}.report h2{font-size:14px;margin:14px 0 6px}.report .period{color:#666;margin-bottom:12px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{border:1px solid #ddd;border-radius:8px;padding:10px}.card b{display:block;font-size:17px;margin-top:3px}.rtable{width:100%;border-collapse:collapse;margin-top:6px}.rtable th,.rtable td{border:1px solid #ddd;padding:5px;text-align:right}.rtable th:first-child,.rtable td:first-child{text-align:left}.grand{font-weight:800;background:#f4f4f4}.note{font-size:9px;color:#666;margin-top:10px}@media(max-width:900px){.grid{grid-template-columns:1fr}.top h1{font-size:17px}}@media print{body[data-print-combined] #app,body[data-print-combined] .top{display:none!important}body[data-print-combined] #report{display:block!important}@page{size:A4 portrait;margin:8mm} body[data-print-supplier] .supplier{display:none} body[data-print-supplier="thch"] .supplier.th,body[data-print-supplier="booker"] .supplier.bk,body[data-print-supplier="sains"] .supplier.sa{display:block} body[data-print-supplier] .weekly,body[data-print-supplier] .sub .week{display:none} body[data-print-supplier] .sub,body[data-print-supplier] .row{grid-template-columns:1fr 90px} body[data-print-supplier] .row:has(.qty[value=""]),body[data-print-supplier] .row:has(.qty[value="0"]){display:none} body[data-print-combined] .qty,body[data-print-combined] .sub .want{display:none} body[data-print-combined] .sub,body[data-print-combined] .row{grid-template-columns:1fr 90px}.top{position:static}.actions{display:none}.grid{display:block;padding:0}.supplier{break-inside:avoid;margin-bottom:8mm;box-shadow:none}.row{padding:5px 8px}.qty,.weekly{height:30px}.head{padding:8px}.hint{display:none}}
.manage{display:flex;gap:6px;align-items:center}.mini{border:1px solid #ddd;background:#fff;border-radius:7px;padding:5px 7px;font-size:11px;font-weight:700}.danger{color:#b00020}.warn{display:inline-flex;margin-left:5px;width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;background:#d71920;color:#fff;font-weight:900;font-size:13px;vertical-align:middle}.addbar{padding:9px 12px;border-bottom:1px solid #eee}.addbtn{width:100%;border:1px dashed currentColor;background:#fff;border-radius:9px;padding:8px;font-weight:800}.modal{position:fixed;inset:0;background:#0008;z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.dialog{background:#fff;border-radius:14px;padding:16px;width:min(520px,100%);max-height:90vh;overflow:auto}.dialog h2{margin:0 0 12px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{font-size:12px;font-weight:700}.form input,.form select{width:100%;padding:9px;border:1px solid #ccc;border-radius:8px;margin-top:4px}.full{grid-column:1/-1}.dialogActions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}@media print{.manage,.addbar,.modal,.warn{display:none!important}}
</style></head><body>
<div class="top"><div><h1>🛒 แผนการสั่งซื้อวัตถุดิบ</h1><small>รวมทุก Supplier ในหน้าเดียว</small></div><div class="actions"><button class="btn" onclick="resetWeek()">ปิดสัปดาห์ / เริ่มสัปดาห์ใหม่</button><button class="btn" onclick="combinedPDF()">📊 PDF สรุปเดือน</button></div></div><main class="grid" id="app"></main><section id="report"></section><div class="modal" id="editModal"><div class="dialog"><h2 id="modalTitle">สินค้า</h2><div class="form"><label class="full">ชื่อสินค้า<input id="fName"></label><label>หมวด<select id="fCat"></select></label><label>หน่วย<input id="fUnit" placeholder="kg / pack / case"></label><label>ราคา £<input id="fPrice" type="number" min="0" step="0.01"></label><label>ปริมาณต่อแพ็ก (ถ้าทราบ)<input id="fSize" type="number" min="0" step="0.001"></label><label>หน่วยปริมาณ<select id="fSizeUnit"><option value="">—</option><option>kg</option><option>g</option><option>L</option><option>ml</option><option>piece</option></select></label><label class="full">รายละเอียด / ยี่ห้อ<input id="fHint"></label></div><div class="dialogActions"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn" onclick="saveItem()">บันทึก</button></div></div></div>
<script>
const CAT={frozen:'1. แช่แข็ง / ซีฟู้ด',produce:'2. ผักสด / ไข่',rice:'3. ข้าว / เส้น / แป้ง / น้ำตาล',sauce:'4. ซอส / กะทิ / เครื่องแกง',seasoning:'5. เครื่องปรุง / สมุนไพร',meat:'1. เนื้อสัตว์ / ไก่',fish:'2. อาหารทะเล / แช่แข็ง',other:'3. อื่น ๆ'};
let DATA={};const KEY='restaurant_supplier_combined_v1';const HISTKEY='restaurant_supplier_order_history_v3';const MASTERKEY='restaurant_supplier_master_v4';let state=JSON.parse(localStorage.getItem(KEY)||'{}');let history=JSON.parse(localStorage.getItem(HISTKEY)||'[]');let editing=null;
function save(){localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem(HISTKEY,JSON.stringify(history))}function key(s,id){return s+'_'+id}function setWant(s,id,v){let k=key(s,id);state[k]=state[k]||{want:0,total:0};state[k].want=Math.max(0,+v||0);save();renderTotals()}
function snapshotWeek(){let now=new Date(), items=[], suppliers={thch:{qty:0,spend:0},booker:{qty:0,spend:0},sains:{qty:0,spend:0}};for(const sup in DATA)for(const i of DATA[sup]){let st=state[key(sup,i.id)]||{},q=+st.total||0;if(q>0){let amount=q*(i.price||0);items.push({supplier:sup,id:i.id,name:i.name,qty:q,unit:i.unit,price:i.price||0,amount});suppliers[sup].qty+=q;suppliers[sup].spend+=amount}}if(!items.length)return false;history.push({closedAt:now.toISOString(),items,suppliers});return true}
function resetWeek(){if(confirm('ปิดสัปดาห์นี้ บันทึกจำนวนและค่าใช้จ่ายลงประวัติรายเดือน แล้วเริ่มสัปดาห์ใหม่หรือไม่?')){for(const sup in DATA)for(const i of DATA[sup]){let st=state[key(sup,i.id)]||{want:0,total:0};st.total+=(+st.want||0);st.want=0;state[key(sup,i.id)]=st}snapshotWeek();for(const sup in DATA)for(const i of DATA[sup])state[key(sup,i.id)]={want:0,total:0};save();render()}}
function currentLive(){let suppliers={thch:{qty:0,spend:0},booker:{qty:0,spend:0},sains:{qty:0,spend:0}};for(const sup in DATA)for(const i of DATA[sup]){let st=state[key(sup,i.id)]||{},q=(+st.total||0)+(+st.want||0);suppliers[sup].qty+=q;suppliers[sup].spend+=q*(i.price||0)}return suppliers}
function money(n){return '£'+(+n||0).toFixed(2)}function monthRange(d){return {start:new Date(d.getFullYear(),d.getMonth(),1),end:new Date(d.getFullYear(),d.getMonth()+1,0,23,59,59,999)}}
function buildReport(){let now=new Date(),rg=monthRange(now),weeks=history.filter(h=>{let d=new Date(h.closedAt);return d>=rg.start&&d<=rg.end});let live=currentLive();if(Object.values(live).some(x=>x.qty>0))weeks.push({closedAt:now.toISOString(),suppliers:live,live:true});let names={thch:'TH/CH SUP',booker:'BOOKER SUP',sains:'SUPERMARKET'},tot={thch:{qty:0,spend:0},booker:{qty:0,spend:0},sains:{qty:0,spend:0}};weeks.forEach(w=>Object.keys(tot).forEach(k=>{let x=w.suppliers[k]||{};tot[k].qty+=x.qty||0;tot[k].spend+=x.spend||0}));let tq=Object.values(tot).reduce((a,x)=>a+x.qty,0),ts=Object.values(tot).reduce((a,x)=>a+x.spend,0);let fmt=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});let rows=weeks.map((w,idx)=>{let q=0,c=0;Object.values(w.suppliers).forEach(x=>{q+=x.qty||0;c+=x.spend||0});return `<tr><td>Week ${idx+1}${w.live?' (current)':''}<br><small>${fmt(new Date(w.closedAt))}</small></td><td>${w.suppliers.thch?.qty||0}<br>${money(w.suppliers.thch?.spend)}</td><td>${w.suppliers.booker?.qty||0}<br>${money(w.suppliers.booker?.spend)}</td><td>${w.suppliers.sains?.qty||0}<br>${money(w.suppliers.sains?.spend)}</td><td><b>${q}</b><br><b>${money(c)}</b></td></tr>`}).join('')||'<tr><td colspan="5">ยังไม่มีประวัติการสั่งซื้อในเดือนนี้</td></tr>';document.getElementById('report').innerHTML=`<div class="report"><h1>สรุปการสั่งซื้อวัตถุดิบประจำเดือน</h1><div class="period">${fmt(rg.start)} – ${fmt(rg.end)}</div><div class="cards"><div class="card">จำนวนที่สั่งรวม<b>${tq}</b></div><div class="card">ค่าใช้จ่ายรวม<b>${money(ts)}</b></div><div class="card">จำนวนสัปดาห์<b>${weeks.length}</b></div></div><h2>รวมทั้งเดือน แยก Supplier</h2><table class="rtable"><tr><th>Supplier</th><th>จำนวน</th><th>ค่าใช้จ่าย</th></tr>${Object.keys(tot).map(k=>`<tr><td>${names[k]}</td><td>${tot[k].qty}</td><td>${money(tot[k].spend)}</td></tr>`).join('')}<tr class="grand"><td>รวมเดือน</td><td>${tq}</td><td>${money(ts)}</td></tr></table><h2>สรุปแต่ละสัปดาห์</h2><table class="rtable"><tr><th>สัปดาห์</th><th>TH/CH<br>จำนวน / £</th><th>BOOKER<br>จำนวน / £</th><th>SUPERMARKET<br>จำนวน / £</th><th>รวม<br>จำนวน / £</th></tr>${rows}</table><div class="note">รอบเดือนเริ่มวันที่ 1 ถึงวันสุดท้ายของเดือน • ยอดย้อนหลังใช้ราคา ณ เวลาที่ปิดสัปดาห์ • สัปดาห์ปัจจุบันรวมข้อมูลที่ยังไม่ปิดสัปดาห์</div></div>`}

function persistMaster(){localStorage.setItem(MASTERKEY,JSON.stringify(DATA))}
function normName(n){return (n||'').toLowerCase().replace(/\b\d+(?:\.\d+)?\s*(kg|g|ml|l|pcs?|pieces?|x)\b/g,' ').replace(/\b(sainsbury'?s|gold plum|happy boy|green dragon|first lady|chaokoh|mae ploy|booker)\b/g,' ').replace(/[^a-zก-๙]+/g,' ').trim()}
function tokens(n){return new Set(normName(n).split(/\s+/).filter(x=>x.length>2))}
function baseUnit(i){let size=+i.size||0,u=(i.sizeUnit||'').toLowerCase();if(!size){let t=(i.name+' '+(i.hint||'')).toLowerCase(),m=t.match(/(\d+(?:\.\d+)?)\s*(kg|g|ml|l)\b/);if(m){size=+m[1];u=m[2]}}if(!size||!i.price)return null;if(u==='g')return {kind:'kg',v:i.price/(size/1000)};if(u==='kg')return {kind:'kg',v:i.price/size};if(u==='ml')return {kind:'l',v:i.price/(size/1000)};if(u==='l')return {kind:'l',v:i.price/size};if(u==='piece')return {kind:'piece',v:i.price/size};return null}
function sameProduct(a,b){let A=tokens(a.name),B=tokens(b.name);if(!A.size||!B.size)return false;let inter=[...A].filter(x=>B.has(x)).length,den=Math.min(A.size,B.size);return den&&inter/den>=0.67}
function expensiveSet(){let all=[];Object.entries(DATA).forEach(([s,arr])=>arr.forEach(i=>all.push({s,i,b:baseUnit(i)})));let bad=new Set();for(let x=0;x<all.length;x++)for(let y=x+1;y<all.length;y++){let a=all[x],b=all[y];if(a.s===b.s||!a.b||!b.b||a.b.kind!==b.b.kind||!sameProduct(a.i,b.i))continue;if(a.b.v>b.b.v*1.001)bad.add(key(a.s,a.i.id));else if(b.b.v>a.b.v*1.001)bad.add(key(b.s,b.i.id))}return bad}
function catOptions(s){let cats=[...new Set(DATA[s].map(i=>i.cat))];return cats.map(c=>`<option value="${c}">${CAT[c]||c}</option>`).join('')}
function openItem(s,id=null){editing={s,id};let i=id==null?{name:'',cat:DATA[s][0]?.cat||'other',unit:'pack',price:'',hint:'',size:'',sizeUnit:''}:DATA[s].find(x=>x.id===id);document.getElementById('modalTitle').textContent=id==null?'เพิ่มสินค้า':'แก้ไขสินค้า';fCat.innerHTML=catOptions(s);fName.value=i.name||'';fCat.value=i.cat;fUnit.value=i.unit||'';fPrice.value=i.price??'';fHint.value=i.hint||'';fSize.value=i.size||'';fSizeUnit.value=i.sizeUnit||'';editModal.classList.add('show')}
function closeModal(){editModal.classList.remove('show');editing=null}
function saveItem(){if(!editing||!fName.value.trim())return alert('กรุณาใส่ชื่อสินค้า');let {s,id}=editing,obj={name:fName.value.trim(),cat:fCat.value,unit:fUnit.value.trim()||'pack',price:fPrice.value===''?null:+fPrice.value,hint:fHint.value.trim(),size:fSize.value===''?null:+fSize.value,sizeUnit:fSizeUnit.value,weekly:0};if(id==null){obj.id=Math.max(0,...DATA[s].map(x=>+x.id||0))+1;DATA[s].push(obj)}else{let ix=DATA[s].findIndex(x=>x.id===id);obj.id=id;obj.weekly=DATA[s][ix].weekly||0;DATA[s][ix]={...DATA[s][ix],...obj}}persistMaster();closeModal();render()}
function deleteItem(s,id){let i=DATA[s].find(x=>x.id===id);if(!i||!confirm(`ลบ “${i.name}” ออกจากรายการถาวรหรือไม่?`))return;DATA[s]=DATA[s].filter(x=>x.id!==id);delete state[key(s,id)];persistMaster();save();render()}
function supplierPDF(s){document.body.dataset.printSupplier=s;window.print();setTimeout(()=>delete document.body.dataset.printSupplier,500)}
function combinedPDF(){buildReport();document.body.dataset.printCombined='1';window.print();setTimeout(()=>delete document.body.dataset.printCombined,500)}
function renderTotals(){document.querySelectorAll('[data-total]').forEach(e=>{let s=e.dataset.total,total=0;for(const i of DATA[s]){let st=state[key(s,i.id)]||{};total+=(st.want||0)*(i.price||0)}e.textContent='£'+total.toFixed(2)})}
function panel(s,title,cls){let groups={};DATA[s].forEach(i=>(groups[i.cat]??=[]).push(i));let costly=expensiveSet();let html=`<section class="supplier ${cls}"><div class="head"><span>${title}</span><button class="pdfbtn" onclick="supplierPDF('${s}')">PDF</button></div><div class="addbar"><button class="addbtn" onclick="openItem('${s}')">＋ เพิ่มสินค้า</button></div><div class="sub"><span>รายการ / ราคา</span><span class="want">จำนวนที่<br>ต้องการ</span><span class="week">ผลรวมสั่ง<br>1 สัปดาห์</span></div>`;for(const [cat,items] of Object.entries(groups)){html+=`<div class="cat">${CAT[cat]||cat}</div>`;for(const i of items){let k=key(s,i.id),st=state[k]||{want:0,total:i.weekly||0};if(!state[k])state[k]=st;let warn=costly.has(k)?'<span class="warn" title="พบสินค้าประเภทเดียวกันที่ราคาต่อหน่วยถูกกว่าใน Supplier อื่น">!</span>':'';html+=`<div class="row"><div><div class="name">${i.id}. ${i.name}${warn}</div><div class="hint">${i.hint||''}</div><div class="price">£${(i.price||0).toFixed(2)} · ${i.unit}</div><div class="manage"><button class="mini" onclick="openItem('${s}',${i.id})">แก้ไข</button><button class="mini danger" onclick="deleteItem('${s}',${i.id})">ลบ</button></div></div><div><input class="qty" type="number" min="0" value="${st.want||''}" oninput="setWant('${s}',${i.id},this.value)"><div class="unit">${i.unit}</div></div><div><input class="weekly" readonly value="${st.total||0}"><div class="unit">${i.unit}</div></div></div>`}}html+=`<div class="sum"><span>มูลค่าที่ต้องการวันนี้</span><span data-total="${s}">£0.00</span></div></section>`;return html}
fetch('data.json').then(r=>r.json()).then(d=>{let saved=localStorage.getItem(MASTERKEY);DATA=saved?JSON.parse(saved):d;if(!saved)persistMaster();render()});function render(){document.getElementById('app').innerHTML=panel('thch','🏪 TH/CH SUP','th')+panel('booker','BOOKER SUP','bk')+panel('sains','🛒 SUPERMARKET','sa');save();renderTotals()}
</script></body></html>
